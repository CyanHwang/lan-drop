<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8892a6"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="19" font-weight="600" fill="#14171f">Lan Drop runtime layout</text>
  <text x="40" y="66" font-size="12.5" fill="#7b8196">One Go binary, one listening port, two frontends</text>

  <!-- Desktop window -->
  <rect x="30" y="195" width="240" height="150" rx="12" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.5"/>
  <text x="50" y="224" font-size="13" font-weight="600" fill="#14171f">Desktop window</text>
  <text x="50" y="244" font-size="11.5" fill="#7b8196">Wails WebView · React</text>
  <text x="50" y="272" font-size="11.5" fill="#414659">· Pick folders to share</text>
  <text x="50" y="292" font-size="11.5" fill="#414659">· Start / stop the server</text>
  <text x="50" y="312" font-size="11.5" fill="#414659">· QR code and live progress</text>

  <!-- Go process -->
  <rect x="320" y="80" width="360" height="420" rx="14" fill="#f7f9fc" stroke="#c9d3e5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="342" y="108" font-size="12" font-weight="600" fill="#3b6cf6" letter-spacing="0.4">GO PROCESS (single binary)</text>

  <rect x="340" y="122" width="320" height="76" rx="10" fill="#ffffff" stroke="#e2e6ee" stroke-width="1.5"/>
  <text x="358" y="148" font-size="12.5" font-weight="600" fill="#14171f">AppService</text>
  <text x="358" y="167" font-size="11" fill="#7b8196">Share list · start/stop · clipboard · open browser</text>
  <text x="358" y="184" font-size="11" fill="#7b8196">Re-emits transfer progress as Wails events</text>

  <rect x="340" y="216" width="320" height="112" rx="10" fill="#ffffff" stroke="#e2e6ee" stroke-width="1.5"/>
  <text x="358" y="242" font-size="12.5" font-weight="600" fill="#14171f">transfer.Server</text>
  <text x="358" y="261" font-size="11" fill="#7b8196">net/http · streaming · resumable</text>
  <rect x="358" y="272" width="118" height="22" rx="5" fill="#eef2ff"/>
  <text x="367" y="287" font-size="10.5" fill="#3b6cf6" font-family="ui-monospace, Consolas, monospace">/api/list</text>
  <rect x="484" y="272" width="140" height="22" rx="5" fill="#eef2ff"/>
  <text x="493" y="287" font-size="10.5" fill="#3b6cf6" font-family="ui-monospace, Consolas, monospace">/api/upload</text>
  <text x="358" y="314" font-size="10.5" fill="#7b8196">Embedded mobile.html · no external assets</text>

  <rect x="340" y="348" width="150" height="52" rx="9" fill="#ffffff" stroke="#e2e6ee" stroke-width="1.5"/>
  <text x="356" y="369" font-size="11.5" font-weight="600" fill="#14171f">lan-drop.ini</text>
  <text x="356" y="386" font-size="10.5" fill="#7b8196">next to the executable</text>

  <rect x="510" y="348" width="150" height="52" rx="9" fill="#ffffff" stroke="#e2e6ee" stroke-width="1.5"/>
  <text x="526" y="369" font-size="11.5" font-weight="600" fill="#14171f">Shared folders</text>
  <text x="526" y="386" font-size="10.5" fill="#7b8196">any count · optional read-only</text>

  <text x="342" y="434" font-size="10.5" fill="#8892a6">-tags server skips Wails and keeps only this side</text>
  <text x="342" y="452" font-size="10.5" fill="#8892a6">Runs on a NAS, Raspberry Pi or in Docker</text>

  <!-- LAN devices -->
  <rect x="730" y="195" width="240" height="150" rx="12" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.5"/>
  <text x="750" y="224" font-size="13" font-weight="600" fill="#14171f">Devices on the LAN</text>
  <text x="750" y="244" font-size="11.5" fill="#7b8196">Browser · nothing to install</text>
  <text x="750" y="272" font-size="11.5" fill="#414659">· Phone or tablet scans the code</text>
  <text x="750" y="292" font-size="11.5" fill="#414659">· Another computer types the URL</text>
  <text x="750" y="312" font-size="11.5" fill="#414659">· Browse · upload · download</text>

  <!-- Links -->
  <line x1="270" y1="270" x2="318" y2="270" stroke="#8892a6" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="294" y="256" font-size="10" fill="#7b8196" text-anchor="middle">Wails</text>
  <text x="294" y="292" font-size="10" fill="#7b8196" text-anchor="middle">methods/events</text>

  <line x1="682" y1="270" x2="728" y2="270" stroke="#8892a6" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="705" y="256" font-size="10" fill="#7b8196" text-anchor="middle">HTTP</text>
  <text x="705" y="292" font-size="10" fill="#7b8196" text-anchor="middle">:8787</text>

  <line x1="500" y1="328" x2="500" y2="346" stroke="#c9d3e5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="612" y="326" font-size="10" fill="#8892a6" text-anchor="middle">read / write</text>
  <line x1="585" y1="328" x2="585" y2="346" stroke="#c9d3e5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
