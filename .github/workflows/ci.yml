name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # go vet ./... and go test -race compile the desktop (cgo) build, so
      # Wails v3 requires GTK4 + WebKitGTK 6.0 development headers here.
      # The wails3 CLI itself is not needed: the generated bindings are
      # committed, which also avoids compiling it on every run.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # main embeds frontend/dist via go:embed; without it go build and go test both fail.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet (desktop)
        run: go vet ./...

      - name: go vet (server mode)
        run: go vet -tags server ./...

      - name: Unit tests
        run: go test ./... -short -race -count=1

      - name: Build server mode
        run: go build -tags server -trimpath -o /tmp/Lan-Drop-server .

  cross-build:
    name: Cross-compile (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Server mode has no GUI dependency, so it is the only target that cross-compiles
      # cleanly. It also proves -tags server compiles on every platform.
      - name: Compile Lan-Drop server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -tags server -trimpath -ldflags="-s -w" -o /tmp/Lan-Drop-server-${{ matrix.goos }} .

  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^build/' || true)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
