name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-latest
            name: linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3.1 defaults to GTK4 + WebKitGTK 6.0 on Linux; the gtk3
      # variant is kept for -tags gtk3 builds. The CLI itself links these
      # libraries, so they must exist before `go install wails3`.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        if: runner.os != 'macOS'
        run: wails3 build

      # macOS goes through the package task instead: it builds the .app
      # bundle and wraps it in a styled .dmg (drag-to-Applications).
      - name: Build and package disk image (macOS)
        if: runner.os == 'macOS'
        run: wails3 task darwin:package:dmg

      - name: List artifacts
        shell: bash
        run: ls -la bin/

      # Windows and Linux ship one executable, so the download is the program
      # itself — no unzip step. macOS gets a disk image: open it, drag the app
      # to Applications, done.
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp "bin/Lan Drop.exe" "out/Lan Drop-${{ matrix.name }}.exe" ;;
            macOS)   cp bin/*.dmg "out/Lan Drop-${{ matrix.name }}.dmg" ;;
            *)       cp bin/lan-drop "out/Lan Drop-${{ matrix.name }}" ;;
          esac
          ls -lh out/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
