name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-latest
            name: linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3 renders through GTK + WebKitGTK on Linux, so the development
      # headers must be present at build time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        run: wails3 build

      - name: List artifacts
        shell: bash
        run: ls -la bin/

      # Windows and Linux ship one executable, so the download is the program
      # itself — no unzip step. macOS has to be an archive because an .app is
      # a directory, not a file.
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp bin/landrop.exe "out/LanDrop-${{ matrix.name }}.exe" ;;
            macOS)   (cd bin && zip -qry "../out/LanDrop-${{ matrix.name }}.zip" .) ;;
            *)       cp bin/landrop "out/LanDrop-${{ matrix.name }}" ;;
          esac
          ls -lh out/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
