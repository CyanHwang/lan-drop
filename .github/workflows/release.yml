name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-latest
            name: linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3.1 defaults to GTK4 + WebKitGTK 6.0 on Linux; the gtk3
      # variant is kept for -tags gtk3 builds. The CLI itself links these
      # libraries, so they must exist before `go install wails3`.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Windows ships a bare executable; Linux is distributed as a deb so the
      # desktop entry, icon and GTK/WebKit dependencies are installed with it.
      - name: Build application (Windows)
        if: runner.os == 'Windows'
        run: wails3 build

      - name: Build deb package (Linux)
        if: runner.os == 'Linux'
        run: wails3 task linux:create:deb

      - name: List artifacts
        shell: bash
        run: ls -la bin/

      # Windows ships a bare executable; Linux ships the deb produced above.
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp "bin/LanDrop.exe" "out/LanDrop-${{ matrix.name }}.exe" ;;
            *)       cp bin/*.deb "out/LanDrop-${{ matrix.name }}.deb" ;;
          esac
          ls -lh out/

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          f=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # Prefer a hand-written note named after the tag. Versions without one
      # fall back to GitHub's auto-generated notes. The tag guard keeps a
      # manual workflow_dispatch run from publishing against a branch ref.
      - name: Upload to release (with notes)
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (auto-generated notes)
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
