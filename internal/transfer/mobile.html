<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070f" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>LanDrop</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --bg-glow: rgba(59,108,246,.07);
  --surface: #ffffff;
  --surface-2: #f2f3f6;
  --surface-3: #e9ebf0;
  --line: rgba(16,22,40,.07);
  --line-2: rgba(16,22,40,.13);
  --text: #14171f;
  --text-2: #414659;
  --muted: #7b8196;
  --accent: #3b6cf6;
  --accent-soft: rgba(59,108,246,.09);
  --ok: #0f9d63;
  --ok-soft: rgba(15,157,99,.12);
  --err: #d93a3a;
  --err-soft: rgba(217,58,58,.09);
  --shadow: 0 1px 2px rgba(16,22,40,.04), 0 8px 24px rgba(16,22,40,.06);
  --shadow-pop: 0 2px 8px rgba(16,22,40,.08), 0 20px 48px rgba(16,22,40,.14);
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06070f;
    --bg-glow: rgba(91,140,255,.1);
    --surface: #0d0f18;
    --surface-2: #151826;
    --surface-3: #1c2030;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.13);
    --text: #e8eaf2;
    --text-2: #b6bccd;
    --muted: #767c92;
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,.13);
    --ok: #3ecf8e;
    --ok-soft: rgba(62,207,142,.14);
    --err: #ff5c5c;
    --err-soft: rgba(255,92,92,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 10px 30px rgba(0,0,0,.3);
    --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 52px rgba(0,0,0,.55);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  transition: background-color .26s ease, color .26s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(520px 260px at 50% -6%, var(--bg-glow), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

@keyframes item-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes sheet-up {
  from { opacity: 0; transform: translate(-50%, 16px) scale(.98); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes shimmer {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 760px;
  height: 100%;
  min-height: 0;
}

/* ---------- top ---------- */

/* Indeterminate progress for directory changes. Two pixels at the top of the
   window: it costs no layout, so the list underneath never moves. */
.load-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  transition: opacity .18s ease;
}

.load-bar.on {
  opacity: 1;
}

.load-bar::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 38%;
  border-radius: 2px;
  background: var(--accent);
  animation: load-run 1.1s ease-in-out infinite;
}

@keyframes load-run {
  0% { left: -38%; }
  100% { left: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .load-bar::after { animation-duration: 2.4s; }
}

.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 16px) 18px 8px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.02em;
  user-select: none;
}
.brand span { color: var(--accent); }

.root-chip {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 999px;
  max-width: 52%;
  transition: background-color .2s, border-color .2s;
}
.root-chip b {
  font-weight: 500;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.root-chip .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
}

/* Compact language toggle: shows the language you would switch TO, which is
   clearer than labelling the current one. */
.lang-btn {
  font: inherit;
  font-size: 11px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 4px 8px;
  cursor: pointer;
  flex-shrink: 0;
  transition: color .2s, border-color .2s;
}
.lang-btn:hover { color: var(--text-2); border-color: var(--accent); }
.lang-btn:active { transform: scale(.96); }

/* ---------- breadcrumbs ---------- */

.crumbs {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 14px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  font-size: 13px;
}
.crumbs::-webkit-scrollbar { display: none; }

.crumbs button {
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  padding: 5px 7px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .16s, color .16s;
}
.crumbs button:active { background: var(--surface-2); }
.crumbs button.current { color: var(--text); font-weight: 500; }
.crumbs .sep { color: var(--line-2); flex-shrink: 0; font-size: 11px; }

/* ---------- list ---------- */

main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 12px 16px;
}

ul.files { list-style: none; margin: 0; padding: 0; }

ul.files li {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  touch-action: manipulation;
  animation: item-in .34s cubic-bezier(.22,.8,.3,1) both;
  transition: background-color .16s, transform .1s;
}
ul.files li:active {
  background: var(--surface-2);
  transform: scale(.985);
}
ul.files li + li::before {
  content: "";
  position: absolute;
  top: 0;
  left: 62px;
  right: 12px;
  height: 1px;
  background: var(--line);
  pointer-events: none;
}

/* Skeleton rows. Same geometry as a real row (38px icon, two text lines) so
   nothing shifts when the content lands. The sweep is one shared keyframe. */
ul.files.skeleton li {
  animation: none;
  pointer-events: none;
  cursor: default;
}
ul.files.skeleton li:active {
  background: none;
  transform: none;
}
.sk-ico,
.sk-line {
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line);
}
.sk-ico {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  flex-shrink: 0;
}
.sk-meta {
  flex: 1;
  min-width: 0;
}
.sk-line {
  display: block;
  height: 12px;
  border-radius: 6px;
}
.sk-line + .sk-line {
  margin-top: 9px;
  height: 9px;
}
.sk-line.a { width: 54%; }
.sk-line.b { width: 31%; }
.sk-ico::after,
.sk-line::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--line-2), transparent);
  animation: shimmer 1.3s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .sk-ico::after,
  .sk-line::after { animation: none; }
}

.ico {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted);
  flex-shrink: 0;
  transition: background-color .2s, box-shadow .2s;
}
.ico.dir {
  color: var(--accent);
  background: var(--accent-soft);
  box-shadow: none;
}
.ico svg { width: 19px; height: 19px; }

.meta { min-width: 0; flex: 1; }
.name {
  display: block;
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.row-actions {
  display: flex;
  gap: 1px;
  flex-shrink: 0;
}
.act-btn {
  border: 0;
  background: none;
  color: var(--muted);
  padding: 9px;
  cursor: pointer;
  border-radius: 10px;
  transition: background .16s, color .16s, transform .1s;
}
.act-btn:active { transform: scale(.88); }
.act-btn.dl:active { background: var(--accent-soft); color: var(--accent); }
.act-btn.del:active { background: var(--err-soft); color: var(--err); }
.act-btn svg { width: 16px; height: 16px; display: block; }

.chev {
  color: var(--muted);
  opacity: .4;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}
.chev svg { width: 16px; height: 16px; }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  padding: 64px 24px;
  animation: fade-in .3s ease both;
}
.empty svg { width: 30px; height: 30px; opacity: .35; }

/* ---------- dock ---------- */

.dock {
  flex-shrink: 0;
  display: flex;
  gap: 9px;
  padding: 10px 14px calc(env(safe-area-inset-bottom) + 12px);
  border-top: 1px solid var(--line);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: border-color .26s, background-color .26s;
}

button.action {
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  touch-action: manipulation;
  transition: transform .12s, opacity .16s, background-color .16s;
}
button.action:active { transform: scale(.97); }
button.action:disabled {
  opacity: .38;
  cursor: not-allowed;
  box-shadow: none;
}
button.action:disabled:active { transform: none; }

button.action.primary {
  flex: 1;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 2px 6px rgba(59,108,246,.28), 0 10px 24px rgba(59,108,246,.22);
}
button.action.primary:active { opacity: .88; }

button.action.ghost {
  flex: 0 0 auto;
  padding: 15px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-2);
}

button.action svg { width: 18px; height: 18px; }

/* ---------- upload sheet ---------- */

.sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 20px);
  max-width: 740px;
  bottom: calc(env(safe-area-inset-bottom) + 86px);
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 4px;
  max-height: 46vh;
  display: none;
  flex-direction: column;
  z-index: 20;
  box-shadow: var(--shadow-pop);
  animation: sheet-up .28s cubic-bezier(.22,.8,.3,1) both;
}
.sheet.show { display: flex; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
}
.sheet-head b {
  font-weight: 500;
  color: var(--text);
  font-size: 12.5px;
}
.sheet-head .spacer { flex: 1; }
.sheet-head button {
  border: 0; background: none; color: var(--muted);
  font: inherit; font-size: 12px;
  padding: 3px 7px; border-radius: 7px; cursor: pointer;
}
.sheet-head button:active { background: var(--surface-2); }

.sheet-body {
  overflow-y: auto;
  min-height: 0;
  padding: 0 4px 4px;
}

.task { padding: 9px 8px 10px; }
.task + .task { border-top: 1px solid var(--line); }

.task-head {
  display: flex;
  gap: 8px;
  align-items: baseline;
  font-size: 13px;
  margin-bottom: 7px;
}
.task-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-pct {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  flex-shrink: 0;
}

.bar {
  position: relative;
  height: 3px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .2s linear, background-color .2s;
}
.bar > i::after {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 34%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  animation: shimmer 1.5s ease-in-out infinite;
  opacity: 0;
}
.task.run .bar > i::after { opacity: 1; }
.task.done .bar > i { background: var(--ok); }
.task.done .bar > i::after { opacity: 0; }
.task.err .bar > i { background: var(--err); width: 100% !important; }
.task.err .bar > i::after { opacity: 0; }

.task-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.task.err .task-sub { color: var(--err); }

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 168px);
  transform: translate(-50%, 10px);
  background: var(--surface);
  border: 1px solid var(--line-2);
  color: var(--text);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 22px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 30;
  max-width: 84vw;
  text-align: center;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
  animation: toast-in .24s cubic-bezier(.22,.8,.3,1);
}

/* ---------- wide screens ---------- */

@media (min-width: 760px) {
  .app { max-width: 900px; }
  .topbar { padding-left: 22px; padding-right: 22px; }
  .crumbs { padding-left: 18px; padding-right: 18px; }
  main { padding-left: 16px; padding-right: 16px; }

  ul.files {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 10px;
    row-gap: 2px;
  }
  ul.files li + li::before { display: none; }

  .dock { justify-content: center; }
  .dock .action.primary { flex: 0 1 420px; }
}

@media (min-width: 1180px) {
  .app { max-width: 1220px; }
  ul.files { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (min-width: 1560px) {
  .app { max-width: 1560px; }
  ul.files { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="load-bar" id="loadBar" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">Lan<span>Drop</span></div>
    <button class="lang-btn" id="langBtn" type="button" aria-label="Language">EN</button>
    <div class="root-chip"><span class="dot"></span><b id="rootName">Connecting…</b></div>
  </header>
  <nav class="crumbs" id="crumbs"></nav>
  <main id="main">
    <!-- Skeleton, not a spinner: it occupies the same space the list will,
         so the first paint never jumps. Rendered again from JS on navigation. -->
    <ul class="files skeleton" aria-hidden="true">
      <li><span class="sk-ico"></span><span class="sk-meta"><i class="sk-line a"></i><i class="sk-line b"></i></span></li>
      <li><span class="sk-ico"></span><span class="sk-meta"><i class="sk-line a"></i><i class="sk-line b"></i></span></li>
      <li><span class="sk-ico"></span><span class="sk-meta"><i class="sk-line a"></i><i class="sk-line b"></i></span></li>
      <li><span class="sk-ico"></span><span class="sk-meta"><i class="sk-line a"></i><i class="sk-line b"></i></span></li>
      <li><span class="sk-ico"></span><span class="sk-meta"><i class="sk-line a"></i><i class="sk-line b"></i></span></li>
    </ul>
  </main>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <b id="sheetTitle" data-i18n="upload">Upload</b>
      <span class="spacer"></span>
      <button id="sheetClose" type="button" data-i18n="hide">Hide</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <footer class="dock">
    <button class="action ghost" id="mkdirBtn" data-i18n-aria="newFolder" aria-label="New folder" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M12 11v5M9.5 13.5h5"/>
      </svg>
    </button>
    <button class="action primary" id="uploadBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M6 11l6-6 6 6"/>
      </svg>
      <span data-i18n="uploadFiles">Upload files</span>
    </button>
    <input type="file" id="fileInput" multiple hidden>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------------- i18n ---------------- */

  var I18N = {
    en: {
      connecting: "Connecting…",
      upload: "Upload",
      hide: "Hide",
      newFolder: "New folder",
      uploadFiles: "Upload files",
      root: "Home",
      noShares: "No shared folders yet",
      sharedFolder: "Shared folder",
      emptyFolder: "This folder is empty",
      folder: "Folder",
      download: "Download",
      delete: "Delete",
      confirmDelete: "Delete \u201c{name}\u201d? This cannot be undone.",
      deleted: "Deleted",
      deleteFailed: "Delete failed: {err}",
      downloadStarted: "Downloading {name}",
      enterShare: "Open a shared folder first",
      newFolderName: "New folder name",
      created: "Created",
      createFailed: "Create failed: {err}",
      connLost: "Connection lost",
      cancelled: "Cancelled",
      resuming: "Resuming {name}",
      filesFailed: "{n} file(s) failed",
      filesUploaded: "Uploaded {n} file(s)",
      uploading: "Uploading {done}/{total}",
      uploadDone: "Upload complete",
      uploadCount: "Upload {done}/{total}",
      done: "Done · {size}",
      failed: "Failed: {err}",
      unknownError: "unknown error",
      waiting: "Waiting · {size}",
      shareCount: "{n} shared folder(s)",
      notConfigured: "Not configured",
      readOnly: "read-only",
      openFailed: "Cannot open: {err}",
      monthDay: "{m}/{d}",
      switchTo: "中"
    },
    "zh-CN": {
      connecting: "连接中",
      upload: "上传",
      hide: "收起",
      newFolder: "新建文件夹",
      uploadFiles: "上传文件",
      root: "根目录",
      noShares: "还没有共享目录",
      sharedFolder: "共享目录",
      emptyFolder: "这个文件夹是空的",
      folder: "文件夹",
      download: "下载",
      delete: "删除",
      confirmDelete: "删除 \u201c{name}\u201d？此操作不可恢复。",
      deleted: "已删除",
      deleteFailed: "删除失败：{err}",
      downloadStarted: "开始下载 {name}",
      enterShare: "先进入一个共享目录",
      newFolderName: "新建文件夹名称",
      created: "已创建",
      createFailed: "创建失败：{err}",
      connLost: "连接中断",
      cancelled: "已取消",
      resuming: "继续传输 {name}",
      filesFailed: "{n} 个文件失败",
      filesUploaded: "已上传 {n} 个文件",
      uploading: "正在上传 {done}/{total}",

    for (var attempt = 0; attempt < 6; attempt++) {
      try {
        var res = await putChunk(task, offset, function (loaded) {
          var now = Date.now();
          var dt = now - task.lastTime;
          if (dt > 400) {
            task.speed = (loaded - task.lastLoaded) * 1000 / dt;
            task.lastTime = now;
            task.lastLoaded = loaded;
          }
          task.loaded = loaded;
          if (now - lastPaint > 110) {
            lastPaint = now;
            renderSheet();
          }
        });

        if (res.conflict) {
          offset = res.size;
          task.loaded = offset;
          task.lastLoaded = offset;
          task.lastTime = Date.now();
          renderSheet();
          continue;
        }

        task.state = "done";
        task.loaded = task.total;
        renderSheet();
        return;
      } catch (e) {
        task.err = e.message;
        renderSheet();
        if (attempt === 5) {
          task.state = "err";
          renderSheet();
          return;
        }
        await sleep(800 * (attempt + 1));
        try {
          var again = await probe(task.share, task.dir, task.file.name);
          offset = again.size || 0;
          task.loaded = offset;
          task.lastLoaded = offset;
          task.lastTime = Date.now();
        } catch (_) { /* keep previous offset */ }
      }
    }
  }

  async function pump() {
    if (uploading) return;
    uploading = true;
    $sheet.classList.add("show");
    while (true) {
      var next = null;
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].state === "wait") { next = tasks[i]; break; }
      }
      if (!next) break;
      await uploadOne(next);
    }
    uploading = false;

    var failed = tasks.filter(function (t) { return t.state === "err"; }).length;
    var doneCount = tasks.filter(function (t) { return t.state === "done"; }).length;
    if (failed) toast(t("filesFailed", { n: failed }));
    else if (doneCount) toast(t("filesUploaded", { n: doneCount }));

    load(shareId, cwd);
    setTimeout(function () {
      if (!uploading) {
        tasks = tasks.filter(function (t) { return t.state === "err"; });
        renderSheet();
        if (!tasks.length) $sheet.classList.remove("show");
      }
    }, 2600);
  }

  function renderSheet() {
    if (!tasks.length) {
      $sheet.classList.remove("show");
      $sheetBody.innerHTML = "";
      return;
    }

    var done = tasks.filter(function (x) { return x.state === "done"; }).length;
    var running = tasks.filter(function (x) { return x.state === "run"; }).length;
    $sheetTitle.textContent = running > 0
      ? t("uploading", { done: done, total: tasks.length })
      : (done === tasks.length ? t("uploadDone") : t("uploadCount", { done: done, total: tasks.length }));

    var html = "";
    for (var i = 0; i < tasks.length; i++) {
      // Named "task" rather than "t": "t" is the translation function.
      var task = tasks[i];
      var pct = task.total ? Math.min(100, Math.round(task.loaded / task.total * 100)) : 0;
      var cls = task.state === "done" ? " done" : (task.state === "err" ? " err" : (task.state === "run" ? " run" : ""));
      var sub;
      if (task.state === "done") sub = t("done", { size: fmtSize(task.total) });
      else if (task.state === "err") sub = t("failed", { err: task.err || t("unknownError") });
      else if (task.state === "wait") sub = t("waiting", { size: fmtSize(task.total) });
      else {
        sub = fmtSize(task.loaded) + " / " + fmtSize(task.total);
        if (task.speed > 0) sub += " · " + fmtSize(task.speed) + "/s";
      }

      html += '<div class="task' + cls + '">' +
        '<div class="task-head"><span class="task-name">' + esc(task.file.name) + "</span>" +
        '<span class="task-pct">' + (task.state === "run" ? pct + "%" : "") + "</span></div>" +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="task-sub">' + esc(sub) + "</div>" +
        "</div>";
    }
    var scroll = $sheetBody.scrollTop;
    $sheetBody.innerHTML = html;
    if ($sheetBody.scrollTop !== scroll) $sheetBody.scrollTop = scroll;
    $sheet.classList.add("show");
  }

  // Bootstrap. Everything the first paint needs — language, read-only flag,
  // share count — is resolved before anything is rendered. Doing it after the
  // first render used to fire a second full list request and show the loading
  // placeholder twice, which read as the page refreshing on its own.
  api("/api/info")
    .then(function (d) {
      if (!d) return;
      readOnly = !!d.readOnly;
      if (typeof d.count === "number") shareCount = d.count;
      // Adopt the host's language unless this browser already stored an
      // explicit choice.
      if (!storedLang && d.lang) lang = normalizeLang(d.lang);
    })
    .catch(function () { /* keep the browser language */ })
    .then(function () {
      document.documentElement.lang = lang;
      applyStatic();
      updateLangButton();
      updateRootChip();
      window.addEventListener("hashchange", onRoute);
      onRoute();
    });

  $langBtn.addEventListener("click", function () {
    setLang(lang === "en" ? "zh-CN" : "en", true);
  });
})();
</script>
</body>
</html>
