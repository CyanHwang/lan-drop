<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070f" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>LanDrop</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --bg-glow: rgba(59,108,246,.07);
  --surface: #ffffff;
  --surface-2: #f2f3f6;
  --surface-3: #e9ebf0;
  --line: rgba(16,22,40,.07);
  --line-2: rgba(16,22,40,.13);
  --text: #14171f;
  --text-2: #414659;
  --muted: #7b8196;
  --accent: #3b6cf6;
  --accent-soft: rgba(59,108,246,.09);
  --ok: #0f9d63;
  --ok-soft: rgba(15,157,99,.12);
  --err: #d93a3a;
  --err-soft: rgba(217,58,58,.09);
  --shadow: 0 1px 2px rgba(16,22,40,.04), 0 8px 24px rgba(16,22,40,.06);
  --shadow-pop: 0 2px 8px rgba(16,22,40,.08), 0 20px 48px rgba(16,22,40,.14);
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06070f;
    --bg-glow: rgba(91,140,255,.1);
    --surface: #0d0f18;
    --surface-2: #151826;
    --surface-3: #1c2030;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.13);
    --text: #e8eaf2;
    --text-2: #b6bccd;
    --muted: #767c92;
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,.13);
    --ok: #3ecf8e;
    --ok-soft: rgba(62,207,142,.14);
    --err: #ff5c5c;
    --err-soft: rgba(255,92,92,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 10px 30px rgba(0,0,0,.3);
    --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 52px rgba(0,0,0,.55);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  transition: background-color .26s ease, color .26s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(520px 260px at 50% -6%, var(--bg-glow), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

@keyframes item-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes check-draw {
  from { stroke-dashoffset: 24; }
  to { stroke-dashoffset: 0; }
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes sheet-up {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes shimmer {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 760px;
  height: 100%;
  min-height: 0;
}

/* ---------- top ---------- */

/* Indeterminate progress for directory changes. Two pixels at the top of the
   window: it costs no layout, so the list underneath never moves. */
.load-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  transition: opacity .18s ease;
}

.load-bar.on {
  opacity: 1;
}

.load-bar::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 38%;
  border-radius: 2px;
  background: var(--accent);
  animation: load-run 1.1s ease-in-out infinite;
}

@keyframes load-run {
  0% { left: -38%; }
  100% { left: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .load-bar::after { animation-duration: 2.4s; }
}

.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 16px) 18px 8px;
}

.brand {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.02em;
  user-select: none;
}
.brand span { color: var(--accent); }

.root-chip {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 999px;
  max-width: 52%;
  transition: background-color .2s, border-color .2s;
}
.root-chip b {
  font-weight: 500;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.root-chip .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
}

/* Compact language toggle: shows the language you would switch TO, which is
   clearer than labelling the current one. */
.lang-btn {
  font: inherit;
  font-size: 11px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 4px 8px;
  cursor: pointer;
  flex-shrink: 0;
  transition: color .2s, border-color .2s;
}
.lang-btn:hover { color: var(--text-2); border-color: var(--accent); }

/* ---------- breadcrumbs ---------- */

/* The back button stays put while the path beside it scrolls. */
.crumb-row {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px 10px;
}
.back-btn {
  flex: 0 0 auto;
  min-height: 32px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 11px 0 9px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text-2);
  font: inherit;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: color .18s, border-color .18s, background-color .18s;
}
.back-btn:hover:not(:disabled) {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}
.back-btn:disabled { opacity: .35; cursor: default; }
.back-btn svg { width: 17px; height: 17px; display: block; }

.crumbs {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  font-size: 13px;
}
.crumbs::-webkit-scrollbar { display: none; }

.crumbs button {
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  padding: 5px 7px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .16s, color .16s;
}
.crumbs button:active { background: var(--surface-2); }
.crumbs button.current { color: var(--text); font-weight: 500; }
.crumbs .sep { color: var(--line-2); flex-shrink: 0; font-size: 11px; }

/* ---------- list ---------- */

main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 12px 18px;
}

ul.files { list-style: none; margin: 0; padding: 0; }

/* Flat rows separated by a hairline, not a stack of cards. The selected row
   gets its tint and rail, but the rule between rows never disappears — losing
   it made consecutive selected items read as one oversized block. */
ul.files li {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 10px;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  animation: item-in .38s cubic-bezier(.22,.8,.3,1) backwards;
  transition: background-color .2s ease;
}
/* File/folder rows carry no padding of their own. Padding on the row left a
   strip outside the selection zone; tapping there fell through to the folder
   navigation handler. Each child now owns its share of the inset instead. */
ul.files li[data-rel] { padding: 0; }
ul.files li[data-rel] > .pick-zone { padding: 11px 0 11px 6px; }
ul.files li[data-rel] > .meta { padding: 11px 0; }
ul.files li[data-rel] > .row-actions { padding: 11px 12px 11px 0; }
ul.files li + li::before {
  content: "";
  position: absolute;
  top: 0;
  left: 100px;
  right: 12px;
  height: 1px;
  background: linear-gradient(90deg, var(--line), transparent 88%);
  pointer-events: none;
}
/* Share-picker rows have no selection zone, so their text starts 38px earlier. */
ul.files li[data-share] + li[data-share]::before { left: 62px; }
/* ::before is the separator, so the accent rail uses ::after. */
ul.files li.sel::after {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
ul.files li.sel { background: var(--accent-soft); }

/* Skeleton rows. Same geometry as a real row (38px icon, two text lines) so
   nothing shifts when the content lands. The sweep is one shared keyframe. */
ul.files.skeleton li {
  animation: none;
  background: none;
  pointer-events: none;
}
.sk-ico,
.sk-line {
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line);
}
.sk-ico {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  flex-shrink: 0;
}
.sk-meta {
  flex: 1;
  min-width: 0;
}
.sk-line {
  display: block;
  height: 12px;
  border-radius: 6px;
}
.sk-line + .sk-line {
  margin-top: 9px;
  height: 9px;
}
.sk-line.a { width: 54%; }
.sk-line.b { width: 31%; }
.sk-ico::after,
.sk-line::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--line-2), transparent);
  animation: shimmer 1.3s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .sk-ico::after,
  .sk-line::after { animation: none; }
}

/* Checkbox, the gap beside it and the icon are one continuous hot zone. A
   finger landing in the space between still selects, which is where most
   near-misses used to go. The button keeps keyboard semantics. */
.pick-zone {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
button.pick {
  flex: 0 0 auto;
  align-self: stretch;
  width: 32px;
  border: 0;
  background: none;
  padding: 0;
  display: grid;
  place-items: center;
  cursor: inherit;
}
button.pick i {
  width: 21px;
  height: 21px;
  border-radius: 7px;
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  display: grid;
  place-items: center;
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.pick-zone:hover button.pick i { border-color: var(--accent); }
button.pick.on i {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 2px 7px rgba(59,108,246,.26);
}
button.pick i svg {
  width: 14px;
  height: 14px;
  color: #fff;
  opacity: 0;
}
button.pick i svg path {
  stroke-dasharray: 24;
  stroke-dashoffset: 24;
}
button.pick.on i svg { opacity: 1; }
button.pick.on i svg path { animation: check-draw .26s cubic-bezier(.3,.9,.3,1) .04s forwards; }

.pick-zone:hover .ico {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
}

/* A selected row carries three cues: tinted surface, accent rail on the left,
   and a solid accent icon. Nothing moves, but the layer gap is unmistakable. */
ul.files li.sel .pick-zone .ico,
ul.files li.sel .pick-zone:hover .ico {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 2px 8px rgba(59,108,246,.24);
}
ul.files li.sel .name { font-weight: 500; }

/* Folder rows also navigate from the name area; files do nothing there. */
ul.files li[data-dir="1"] .meta { cursor: pointer; }
ul.files li[data-dir="1"]:hover .name { color: var(--accent); }

.ico {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted);
  flex-shrink: 0;
  transition: background-color .2s, box-shadow .2s, color .2s;
}
.ico.dir {
  color: var(--accent);
  background: var(--accent-soft);
  box-shadow: none;
}
.ico svg { width: 19px; height: 19px; }

.meta { min-width: 0; flex: 1; }
.name {
  display: block;
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sub {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.row-actions {
  display: flex;
  gap: 1px;
  flex-shrink: 0;
}
.act-btn {
  border: 0;
  background: none;
  color: var(--muted);
  padding: 9px;
  cursor: pointer;
  border-radius: 10px;
  transition: background .16s, color .16s;
}
.act-btn.dl:active { background: var(--accent-soft); color: var(--accent); }
.act-btn.del:active { background: var(--err-soft); color: var(--err); }
.act-btn svg { width: 16px; height: 16px; display: block; }

.chev {
  color: var(--muted);
  opacity: .4;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}
.chev svg { width: 16px; height: 16px; }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  padding: 64px 24px;
  animation: fade-in .3s ease both;
}
.empty svg { width: 30px; height: 30px; opacity: .35; }

/* ---------- dock ---------- */

.dock {
  position: relative;
  flex-shrink: 0;
  display: flex;
  gap: 9px;
  padding: 10px 14px calc(env(safe-area-inset-bottom) + 12px);
  border-top: 1px solid var(--line);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: border-color .26s, background-color .26s;
}

/* Selection bar. Anchored to the top edge of the dock rather than to a
   viewport offset, so it stays glued to the buttons however tall they get. */
.selbar {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  width: calc(100% - 20px);
  max-width: 520px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 7px 7px 10px;
  border-radius: 15px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-pop);
  opacity: 0;
  transform: translate(-50%, 10px);
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  z-index: 15;
}
.selbar.on {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}
.selbar .all {
  flex-shrink: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  font-size: 13px;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.selbar .all:active { background: var(--accent-soft); }
.selbar .count {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 5px 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.selbar .spacer { flex: 1; min-width: 4px; }
.selbar button.action {
  flex: 0 0 auto;
  padding: 9px 13px;
  font-size: 13.5px;
  border-radius: 10px;
  gap: 6px;
}
.selbar button.action.primary { flex: 0 0 auto; box-shadow: none; }
.selbar button.action.ghost {
  flex: 0 0 auto;
  padding: 9px 10px;
  border: 0;
  background: none;
  color: var(--muted);
}
.selbar button.action svg { width: 15px; height: 15px; }

button.action {
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  touch-action: manipulation;
  transition: opacity .16s, background-color .16s;
}
button.action:disabled {
  opacity: .38;
  cursor: not-allowed;
  box-shadow: none;
}

button.action.primary {
  flex: 1;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 2px 6px rgba(59,108,246,.28), 0 10px 24px rgba(59,108,246,.22);
}
button.action.primary:active { opacity: .88; }

button.action.ghost {
  flex: 0 0 auto;
  padding: 15px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-2);
}

button.action svg { width: 18px; height: 18px; }

/* ---------- upload sheet ---------- */

.sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 20px);
  max-width: 740px;
  bottom: calc(env(safe-area-inset-bottom) + 86px);
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 4px;
  max-height: 46vh;
  display: none;
  flex-direction: column;
  z-index: 20;
  box-shadow: var(--shadow-pop);
  animation: sheet-up .28s cubic-bezier(.22,.8,.3,1) both;
}
.sheet.show { display: flex; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
}
.sheet-head b {
  font-weight: 500;
  color: var(--text);
  font-size: 12.5px;
}
.sheet-head .spacer { flex: 1; }
.sheet-head button {
  border: 0; background: none; color: var(--muted);
  font: inherit; font-size: 12px;
  padding: 3px 7px; border-radius: 7px; cursor: pointer;
}
.sheet-head button:active { background: var(--surface-2); }
/* Destructive: dropping the queue is the one irreversible action in this panel. */
.sheet-head button.danger { color: var(--err); }
.sheet-head button.danger:active { background: var(--err-soft); }

/* Floating entry point while the panel is hidden. Hiding it must not also hide
   the only way back to progress and to the cancel button. */
.up-pill {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 84px);
  transform: translateX(-50%);
  z-index: 45;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-pop);
  cursor: pointer;
}
.up-pill[hidden] { display: none; }
.up-pill-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #fff;
  animation: up-pulse 1.4s ease-in-out infinite;
}
@keyframes up-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* Drop target is the whole window: aiming at a 300 px panel is silly. */
.drop-hint {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 2px dashed var(--accent);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
}
.drop-hint[hidden] { display: none; }

.sheet-body {
  overflow-y: auto;
  min-height: 0;
  padding: 0 4px 4px;
}

.task { padding: 9px 8px 10px; }
.task + .task { border-top: 1px solid var(--line); }

.task-head {
  display: flex;
  gap: 8px;
  align-items: baseline;
  font-size: 13px;
  margin-bottom: 7px;
}
.task-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-pct {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  flex-shrink: 0;
}

.bar {
  position: relative;
  height: 3px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .2s linear, background-color .2s;
}
.bar > i::after {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 34%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  animation: shimmer 1.5s ease-in-out infinite;
  opacity: 0;
}
.task.run .bar > i::after { opacity: 1; }
.task.done .bar > i { background: var(--ok); }
.task.done .bar > i::after { opacity: 0; }
.task.err .bar > i { background: var(--err); width: 100% !important; }
.task.err .bar > i::after { opacity: 0; }

.task-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.task.err .task-sub { color: var(--err); }

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 168px);
  transform: translate(-50%, 10px);
  background: var(--surface);
  border: 1px solid var(--line-2);
  color: var(--text);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 22px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 30;
  max-width: 84vw;
  text-align: center;
  box-shadow: var(--shadow);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
  animation: toast-in .24s cubic-bezier(.22,.8,.3,1);
}

/* ---------- wide screens ---------- */

@media (min-width: 760px) {
  .app { max-width: 900px; }
  .topbar { padding-left: 22px; padding-right: 22px; }
  .crumbs { padding-left: 18px; padding-right: 18px; }
  main { padding-left: 16px; padding-right: 16px; }

  ul.files {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 10px;
    row-gap: 0;
  }
  /* li + li keys off DOM order, but in a grid the first visual row has N
     cells. Hide the rule on all of them so every row starts clean. */
  ul.files li:nth-child(-n+2)::before { display: none; }

  .dock { justify-content: center; }
  .dock .action.primary { flex: 0 1 420px; }
}

@media (min-width: 1180px) {
  .app { max-width: 1220px; }
  ul.files { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  ul.files li:nth-child(-n+3)::before { display: none; }
}

@media (min-width: 1560px) {
  .app { max-width: 1560px; }
  ul.files { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  ul.files li:nth-child(-n+4)::before { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

    return dir ? dir + "/" + name : name;

  function pickedList() {

    for (var k in picked) {

    }
    return out;
  }

  function clearPicked() {

  function applyPick(li, on) {
    if (!li) return;
    li.classList.toggle("sel", on);

    if (!box) return;
    box.classList.toggle("on", on);
    box.setAttribute("aria-pressed", on ? "true" : "false");

    applyPick(li, !!picked[rel]);
    updateSelBar();
  }

  // One pass over the rendered rows. Calling applyPick per entry instead would
  // be quadratic, which a folder of a few thousand files would notice.
  function syncPicks() {
    var lis = $main.querySelectorAll("li[data-rel]");
    for (var i = 0; i < lis.length; i++) {
      applyPick(lis[i], !!picked[lis[i].getAttribute("data-rel")]);
    }
  }

  function updateSelBar() {
    var n = pickedList().length;
    if (!n) {
      $selBar.classList.remove("on");
      return;
    }
    $selBar.classList.add("on");
    $selCount.textContent = t("selectedCount", { n: n });

    $selAll.textContent = (entries.length > 0 && n >= entries.length) ? t("clearAll") : t("selectAll");
  }

  function toggleSelectAll() {
    var all = entries.length > 0 && pickedList().length >= entries.length;
    picked = {};

  function appendHidden(form, name, value) {

    el.type = "hidden";

  // Posted as a form rather than followed as a link: a batch can carry
  // thousands of paths, and that does not belong in a URL. The response sets
  // Content-Disposition, so the browser downloads it and stays on this page.
  function downloadZip() {
    var paths = pickedList();
    if (!paths.length) {
      toast(t("selectNothing"));
      return;
    }
    if (paths.length > MAX_PICK) {
      toast(t("tooManyPicked", { n: MAX_PICK }));
      return;

    var form = $zipForm;
    form.innerHTML = "";
    appendHidden(form, "share", shareId);
    appendHidden(form, "dir", cwd);

  // Upload and mkdir need a target share; they are meaningless at the virtual root.
  function setDockEnabled(on) {
    var usable = on && !readOnly;

    document.getElementById("uploadDirBtn").disabled = !usable;
    document.getElementById("mkdirBtn").disabled = !usable;

  function api(path, timeoutMs) {
    var opts = { headers: { Accept: "application/json" } };
    var timer = 0;
    if (timeoutMs) {
      var ctl = new AbortController();
      opts.signal = ctl.signal;
      timer = setTimeout(function () { ctl.abort(); }, timeoutMs);
    }
    function done() { if (timer) { clearTimeout(timer); timer = 0; } }
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (data) {
        done();
        if (!r.ok) throw new Error(data && data.error ? data.error : ("HTTP " + r.status));
        return data;
      }, function (e) { done(); throw e; });
    }, function (e) { done(); throw e; });
  }

  /* ---------------- routing ---------------- */

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    if (!h) return { share: "", dir: "" };
    var parts = h.split("/");
    if (parts[0] === "s" && parts[1]) {
      var dir = parts.slice(2).map(decodeURIComponent).join("/");
      return { share: decodeURIComponent(parts[1]), dir: dir };
    }
    return { share: "", dir: "" };
  }

  function buildHash(share, dir) {
    if (!share) return "#/";
    var h = "#/s/" + encodeURIComponent(share);
    if (dir) {
      h += "/" + dir.split("/").map(encodeURIComponent).join("/");
    }
    return h;
  }

  function nav(share, dir) {
    var h = buildHash(share, dir);
    if (location.hash === h) {
      load(share, dir);
    } else {
      location.hash = h;
    }
  }

  // Up one folder, or back to the share picker when already at a share root.
  function goBack() {
    if (cwd) {

      nav("", "");
    }
  }

  function onRoute() {
    var r = parseHash();
    load(r.share, r.dir);

  // Same rows the initial page ships, rebuilt for navigation.
  var skeletonHTML = (function () {
    var row = '<li><span class="sk-ico"></span><span class="sk-meta">' +
      '<i class="sk-line a"></i><i class="sk-line b"></i></span></li>';

  // for that is worse than showing nothing at all.
  var skeletonTimer = null;

  function showSkeleton() {
    cancelSkeleton();

      skeletonTimer = null;
      $main.innerHTML = skeletonHTML;
      $main.scrollTop = 0;

      setDockEnabled(false);

  }

  function cancelSkeleton() {
    if (skeletonTimer) {

      skeletonTimer = null;

  // instead. Replacing a populated list with skeleton rows made the page
  // jump on every tap, which read as flicker rather than loading.
  function showLoadingBar() {
    if ($loadBar) $loadBar.classList.add("on");
  }

  function hideLoadingBar() {
    if ($loadBar) $loadBar.classList.remove("on");
  }

  // silent skips the skeleton, used when the current view is about to be
  // replaced immediately anyway (the cold-start jump into a lone share).
  function load(share, dir, silent) {
    var nextShare = share || "";
    var nextDir = dir || "";
    // Changing folder invalidates every selected path. A silent repaint of the
    // same folder — which is what a language switch does — must keep them.
    if (nextShare !== shareId || nextDir !== cwd) clearPicked();
    shareId = nextShare;
    cwd = nextDir;
    if (silent) {
      cancelSkeleton();
      hideLoadingBar();
    } else if (hasContent) {
      showLoadingBar();
    } else {
      showSkeleton();
    }

    api("/api/list?share=" + encodeURIComponent(shareId) + "&dir=" + encodeURIComponent(cwd))
      .then(function (data) {
        cancelSkeleton();
        hideLoadingBar();
        hasContent = true;
        if (data.mode === "roots") {
          // With exactly one share the virtual root is a pointless extra tap;
          // jump straight in and rewrite the URL so refresh keeps the position.
          if (data.roots.length === 1 && coldStart) {
            coldStart = false;
            var only = data.roots[0].id;
            history.replaceState(null, "", buildHash(only, ""));
            load(only, "", true);
            return;
          }
          shareName = "";
          renderCrumbs();
          renderRoots(data);
        } else {
          shareId = data.share || "";
          shareName = data.shareName || "";
          cwd = data.dir || "";
          renderCrumbs();
          renderFiles(data);
        }
      })
      .catch(function (e) {
        cancelSkeleton();
        hideLoadingBar();

  function renderCrumbs() {

        ' style="animation-delay:' + delay.toFixed(3) + 's">' +
        '<span class="pick-zone" data-pick="' + esc(rel) + '">' +
        '<button type="button" class="pick' + (on ? " on" : "") + '"' +
        ' aria-pressed="' + (on ? "true" : "false") +
        '" aria-label="' + esc(t("selectItem", { name: e.name })) + '"><i>' + ICO_CHECK + "</i></button>" +
        '<span class="ico' + (e.isDir ? " dir" : "") + '">' +
        (e.isDir ? ICO_DIR : fileIcon(e.name)) + "</span></span>" +
        '<span class="meta"><span class="name">' + esc(e.name) + "</span>" +
        '<span class="sub">' + esc(sub) + "</span></span>" +

    $main.scrollTop = 0;

  }

  $crumbs.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-go-root")) {
      nav("", "");
    } else if (b.hasAttribute("data-go-share")) {
      nav(shareId, "");
    } else if (b.hasAttribute("data-go-dir")) {
      nav(shareId, b.getAttribute("data-go-dir"));
    }
  });

  $main.addEventListener("click", function (ev) {
    // The checkbox column and the icon beside it are the selection hot spots.
    var pk = ev.target.closest("[data-pick]");
    if (pk) {
      ev.stopPropagation();
      togglePick(pk.closest("li"), pk.getAttribute("data-pick"));
      return;
    }

    var dl = ev.target.closest("button[data-dl]");
    if (dl) {
      ev.stopPropagation();
      downloadFile(dl.getAttribute("data-dl"));
      return;
    }

    var del = ev.target.closest("button[data-del]");
    if (del) {
      ev.stopPropagation();
      var rel = del.getAttribute("data-del");
      if (confirm(t("confirmDelete", { name: rel.split("/").pop() }))) {
        fetch("/api/file?share=" + encodeURIComponent(shareId) + "&path=" + encodeURIComponent(rel), {
          method: "DELETE"
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.error) throw new Error(d.error);
            toast(t("deleted"));
            load(shareId, cwd);
          })
          .catch(function (e) { toast(t("deleteFailed", { err: e.message })); });
      }
      return;
    }

    var root = ev.target.closest("li[data-share]");
    if (root) {
      nav(root.getAttribute("data-share"), "");
      return;
    }

    // Name and the space to its right open a folder. For files that whole
    // area is intentionally inert — downloading lives in its own button.
    var li = ev.target.closest("li[data-rel]");
    if (!li || li.getAttribute("data-dir") !== "1") return;
    nav(shareId, li.getAttribute("data-rel"));

  $selAll.addEventListener("click", toggleSelectAll);

  document.getElementById("selDownload").addEventListener("click", downloadZip);

  document.getElementById("selClear").addEventListener("click", function () {
    clearPicked();
    syncPicks();
  });

  $backBtn.addEventListener("click", goBack);

  function downloadFile(rel) {
    var name = rel.split("/").pop();
    var a = document.createElement("a");
    a.href = "/api/download?share=" + encodeURIComponent(shareId) + "&path=" + encodeURIComponent(rel);
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast(t("downloadStarted", { name: name }));
  }

  document.getElementById("uploadBtn").addEventListener("click", function () {
    if (!shareId) {
      toast(t("enterShare"));
      return;
    }
    $fileInput.click();
  });

  // enqueue turns picked or dropped files into queued tasks. dir is the folder
  // path relative to whatever the user selected, so a dropped folder keeps its
  // shape instead of dumping every file into the current directory.
  function enqueue(items) {
    if (!items || !items.length) return;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      tasks.push({
        id: ++taskSeq,
        file: it.file,
        share: shareId,
        dir: it.dir ? (cwd ? cwd + "/" + it.dir : it.dir) : cwd,
        loaded: 0,
        total: it.file.size,
        state: "wait",
        speed: 0,
        err: "",
        lastTime: 0,
        lastLoaded: 0
      });
    }

    // Keep the list bounded: the sheet rebuilds every row on each progress
    // tick, so an unbounded array quietly slows down a long session.
    while (tasks.length > 60) {
      var dropAt = -1;
      for (var d = 0; d < tasks.length; d++) {
        if (tasks[d].state === "done" || tasks[d].state === "err") {
          dropAt = d;
          break;
        }
      }
      if (dropAt < 0) break;
      tasks.splice(dropAt, 1);
    }

    sheetHidden = false; // a fresh batch should show itself
    renderSheet();
    pump();
  }

  $fileInput.addEventListener("change", function () {
    var files = Array.prototype.slice.call($fileInput.files || []);
    $fileInput.value = "";
    if (!files.length) return;
    enqueue(files.map(function (f) { return { file: f, dir: "" }; }));
  });

  // A folder picker only reports files, each carrying its path relative to the
  // selected root. The server creates the missing directories as the uploads
  // land, so nothing else is needed here.
  $dirInput.addEventListener("change", function () {
    var files = Array.prototype.slice.call($dirInput.files || []);
    $dirInput.value = "";
    if (!files.length) return;
    enqueue(files.map(function (f) {
      var rel = f.webkitRelativePath || "";
      var cut = rel.lastIndexOf("/");
      return { file: f, dir: cut < 0 ? "" : rel.slice(0, cut) };
    }));
  });

  $uploadDirBtn.addEventListener("click", function () {
    if (!shareId) {
      toast(t("enterShare"));
      return;
    }
    $dirInput.click();
  });

  /* ---------------- drag and drop ---------------- */

  function hasFiles(e) {
    var dt = e.dataTransfer;
    if (!dt) return false;
    var types = dt.types || [];
    for (var i = 0; i < types.length; i++) {
      if (types[i] === "Files") return true;
    }

  }

  // readEntries returns at most 100 entries per call, so a folder has to be
  // drained in a loop until it reports empty.
  function walkEntry(entry, dir, out) {
    return new Promise(function (resolve) {
      if (entry.isFile) {
        entry.file(function (f) {
          out.files.push({ file: f, dir: dir });
          resolve();
        }, function () { resolve(); });
        return;
      }
      if (!entry.isDirectory) {
        resolve();
        return;
      }
      var sub = dir ? dir + "/" + entry.name : entry.name;
      out.dirs.push(sub);
      var reader = entry.createReader();
      var pendingReads = [];
      (function readBatch() {
        reader.readEntries(function (batch) {
          if (!batch.length) {
            Promise.all(pendingReads).then(function () { resolve(); });
            return;
          }
          for (var i = 0; i < batch.length; i++) {
            pendingReads.push(walkEntry(batch[i], sub, out));
          }
          readBatch();
        }, function () { resolve(); });
      })();
    });
  }

  // An empty folder contains no files to create it, so it gets an explicit
  // mkdir. Best effort: a failure costs an empty directory, nothing more.
  function ensureDir(rel) {
    var full = cwd ? cwd + "/" + rel : rel;
    var cut = full.lastIndexOf("/");
    var parent = cut < 0 ? "" : full.slice(0, cut);
    var leaf = cut < 0 ? full : full.slice(cut + 1);
    if (!leaf) return;
    fetch("/api/mkdir?share=" + encodeURIComponent(shareId) +
      "&dir=" + encodeURIComponent(parent) + "&name=" + encodeURIComponent(leaf),
      { method: "POST" }).catch(function () { /* the upload recreates it */ });
  }

  async function dropUpload(dt) {
    var items = dt.items;
    if (!items || !items.length || typeof items[0].webkitGetAsEntry !== "function") {
      // Older browsers: files only, folders arrive as a flat list.
      enqueue(Array.prototype.slice.call(dt.files || []).map(function (f) {
        return { file: f, dir: "" };
      }));
      return;
    }
    var entries = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind !== "file") continue;
      var entry = items[i].webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
    var out = { files: [], dirs: [] };
    await Promise.all(entries.map(function (e) { return walkEntry(e, "", out); }));
    out.dirs.forEach(function (d) { ensureDir(d); });
    if (out.files.length) enqueue(out.files);
  }

    if (!hasFiles(e)) return;

      toast(t("enterShare"));
      return;

  document.getElementById("mkdirBtn").addEventListener("click", function () {
    if (!shareId) {
      toast(t("enterShare"));
      return;
    }
    var name = prompt(t("newFolderName"));
    if (!name) return;
    fetch("/api/mkdir?share=" + encodeURIComponent(shareId) +
      "&dir=" + encodeURIComponent(cwd) + "&name=" + encodeURIComponent(name), { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {

  document.getElementById("sheetClose").addEventListener("click", function () {
    sheetHidden = true;

  $upPill.addEventListener("click", function () {

  // Closing the tab mid-transfer is the most expensive mistake available here:

  function probe(share, dir, name, total) {

    // is the only reliable way to skip a re-upload of something it already has.
    if (total) url += "&total=" + encodeURIComponent(total);

  // Uploaded in chunks on purpose. One 5 GB request means a hiccup at 99% costs
  // the entire request. 32 MB caps what a single failure can waste and keeps

  // held in memory once so it can be hashed and sent without a second read.
  var CHUNK_SIZE = 32 * 1024 * 1024;

  // take fifteen minutes to admit that, which is an eternity in front of a
  // screen. A watchdog aborts and lets the retry logic resume.
  var IDLE_TIMEOUT = 45000;
  // Consecutive attempts that advance zero bytes before giving up. A transfer
  // that keeps making progress is never abandoned, however flaky the link.
  var MAX_STALLED = 12;

  // CRC32 over the exact bytes we are about to send. TCP's own checksum is 16

  // than people assume; this is the cheap backstop that turns "the file
  // arrived and nobody noticed it was wrong" into a retryable error.
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {

      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      c = (c >>> 8) ^ CRC_TABLE[(c ^ bytes[i]) & 0xFF];
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // putChunk sends bytes [offset, end) and resolves with the server's byte
  // count, which is the only number worth trusting for the next offset.
  function putChunk(task, offset, end, epoch, onProgress) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      var watchdog = 0;
      var settled = false;
      // Exposed on the task so "cancel all" can abort this exact request
      // instead of waiting for the current chunk to finish.
      task.xhr = xhr;

      function settle(fn, value) {
        if (settled) return;
        settled = true;
        clearTimeout(watchdog);
        if (task.xhr === xhr) task.xhr = null;
        fn(value);
      }
      function arm(ms) {
        clearTimeout(watchdog);
        watchdog = setTimeout(function () {
          try { xhr.abort(); } catch (_) { /* already gone */ }
          settle(reject, new Error(t("stalled")));
        }, ms || IDLE_TIMEOUT);
      }

      xhr.open("PUT", "/api/upload?share=" + encodeURIComponent(task.share) +
        "&dir=" + encodeURIComponent(task.dir) + "&name=" + encodeURIComponent(task.file.name));
      xhr.setRequestHeader("X-Offset", String(offset));
      xhr.setRequestHeader("X-Total-Size", String(task.total));
      // The fingerprint lets the server refuse to resume into bytes that came
      // from a different file that happened to share this name.
      xhr.setRequestHeader("X-File-Size", String(task.total));
      xhr.setRequestHeader("X-File-Mtime", String(task.file.lastModified || 0));
      // One transfer, many requests: the id keeps the desktop activity list
      // showing a single row. The server timestamps the first chunk itself —
      // a clock from this device would just import its skew into the speed.
      xhr.setRequestHeader("X-Upload-Id", task.uploadId);
      xhr.setRequestHeader("Content-Type", "application/octet-stream");

      xhr.upload.onprogress = function (e) {
        arm();
        if (e.lengthComputable) onProgress(offset + e.loaded);
      };
      // Body fully sent. The server may now be flushing several gigabytes to
      // disk before it answers, so give it a much longer leash than a socket
      // that has stopped moving data deserves.
      xhr.upload.onload = function () { arm(300000); };
      xhr.onload = function () {
        var body = null;
        try { body = JSON.parse(xhr.responseText); } catch (_) { /* ignore */ }
        if (xhr.status === 200 && body) {
          settle(resolve, { size: body.size, complete: !!body.complete });
        } else if (xhr.status === 409 && body) {
          settle(resolve, { conflict: true, reset: !!body.reset, busy: !!body.busy, size: body.size || 0 });
        } else {
          settle(reject, new Error((body && body.error) || ("HTTP " + xhr.status)));
        }
      };
      xhr.onerror = function () { settle(reject, new Error(t("connLost"))); };
      xhr.onabort = function () { settle(reject, new Error(t("stalled"))); };
      xhr.ontimeout = function () { settle(reject, new Error(t("stalled"))); };
      xhr.timeout = 0; // the watchdog above is the real limit

      // Read the chunk once and send those same bytes, rather than handing the
      // Blob to the browser and hashing a second copy: on a slow source disk a
      // second read would double the very bottleneck this tool already has.
      task.file.slice(offset, end).arrayBuffer().then(function (buf) {
        if (settled) return;
        if (stale(epoch)) {
          settle(reject, new Error(t("cancelled")));
          return;
        }
        xhr.setRequestHeader("X-Chunk-CRC32", String(crc32(new Uint8Array(buf))));
        arm();
        xhr.send(buf);
      }, function () {
        settle(reject, new Error(t("readFailed")));
      });
    });
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // Exponential backoff with jitter, capped so a long outage still recovers
  // within seconds of the network coming back.
  function backoffMs(stalled) {
    var base = Math.min(15000, 800 * Math.pow(2, Math.max(0, stalled - 1)));
    return base + Math.floor(Math.random() * 400);
  }

  // A dropped link is the most common reason an upload dies on a phone or a
  // laptop. Wait for the OS to say it is back instead of burning attempts
  // against a network that is not there.
  function waitOnline(ms) {
    return new Promise(function (resolve) {
      if (navigator.onLine !== false) { resolve(); return; }
      var done = false;
      function go() {
        if (done) return;
        done = true;
        window.removeEventListener("online", go);
        resolve();
      }
      window.addEventListener("online", go);
      setTimeout(go, ms);
    });
  }

  async function uploadOne(task, epoch) {
    task.state = "run";
    task.err = "";
    task.lastTime = Date.now();
    task.lastLoaded = 0;
    renderSheet();

    if (stale(epoch)) return;

    var offset = 0;
    var probed = false;
    try {
      var p = await probe(task.share, task.dir, task.file.name, task.total);
      probed = true;
      if (p.complete) {
        task.state = "done";
        task.loaded = task.total;
        renderSheet();
        return;
      }
      offset = p.size || 0;
      if (offset > 0) toast(t("resuming", { name: task.file.name }));
    } catch (_) {
      // Unknown, not zero. Starting at 0 would truncate whatever the server
      // already staged, so the probe is retried inside the loop instead.
    }

    if (!task.uploadId) task.uploadId = newUploadId();

    task.loaded = offset;
    var stalled = 0;
    var lastOffset = offset;
    var lastPaint = 0;

    while (true) {
      if (stale(epoch)) return;
      await waitOnline(15000);
      if (stale(epoch)) return;

      var end = Math.min(offset + CHUNK_SIZE, task.total);
      try {
        if (!probed) {
          var first = await probe(task.share, task.dir, task.file.name, task.total);
          probed = true;
          if (first.complete) {
            task.state = "done";
            task.loaded = task.total;
            task.err = "";
            renderSheet();
            return;
          }
          offset = first.size || 0;
          lastOffset = offset;
          task.loaded = offset;
          renderSheet();
          end = Math.min(offset + CHUNK_SIZE, task.total);
        }

        var res = await putChunk(task, offset, end, epoch, function (loaded) {
          var now = Date.now();
          var dt = now - task.lastTime;
          if (dt > 400) {
            task.speed = (loaded - task.lastLoaded) * 1000 / dt;
            task.lastTime = now;
            task.lastLoaded = loaded;
          }
          task.loaded = loaded;
          if (now - lastPaint > 110) {
            lastPaint = now;
            renderSheet();
          }
        });

        if (res.reset) {
          // The staged bytes belong to a different file with the same name.
          // Start over rather than splice two files together.
          offset = 0;
          lastOffset = 0;
          task.loaded = 0;
          task.err = "";
          renderSheet();
          continue;
        }
        if (res.conflict) {
          // Another device is mid-upload on this exact file. Waiting beats
          // hammering: its chunks are landing, ours would only fight them.
          if (res.busy) {
            stalled++;
            task.err = t("busy");
            renderSheet();
            if (stalled > MAX_STALLED) throw new Error(t("busy"));
            await sleep(backoffMs(stalled));
            continue;
          }
          // The server's byte count is the only one that matters.
          var advanced = res.size !== lastOffset;
          if (!advanced) stalled++;
          offset = res.size;
          lastOffset = offset;
          task.loaded = offset;
          renderSheet();
          if (stalled > MAX_STALLED) throw new Error(t("connLost"));
          // No progress means retrying instantly would just be noise.
          if (!advanced) await sleep(backoffMs(stalled));
          continue;
        }

        offset = res.size;
        task.loaded = offset;
        // Do not zero the speed here: at 64 MB per chunk that would make the
        // readout flicker to nothing roughly once a second. Resetting the
        // window is enough for the next delta to stay honest.
        task.lastTime = Date.now();
        task.lastLoaded = offset;
        renderSheet();

        if (res.complete || offset >= task.total) {
          // Never trust "done" alone: a truncated file that is reported as
          // complete is worse than a failed transfer, because nobody retries.
          if (offset !== task.total) throw new Error(t("sizeMismatch"));
          task.state = "done";
          task.loaded = task.total;
          task.err = "";
          renderSheet();
          return;
        }

        stalled = 0;
        lastOffset = offset;
      } catch (e) {
        // The abort we caused ourselves is not a failure worth retrying.
        if (stale(epoch)) return;
        stalled++;
        // "Connection lost" is a lie when the service was stopped on the
        // desktop; the watcher knows which one it is.
        task.err = serverDown
          ? t("serverDown")
          : stalled > 1
            ? t("retrying", { n: stalled, err: e.message })
            : e.message;
        renderSheet();

        if (stalled > MAX_STALLED) {
          task.state = "err";
          renderSheet();
          return;
        }
        await sleep(backoffMs(stalled));
        if (stale(epoch)) return;

        // Ask how much actually landed: a request can die after its bytes were
        // written, and resuming from the client's stale idea of the offset
        // would duplicate a chunk.
        try {
          var again = await probe(task.share, task.dir, task.file.name, task.total);
          if (again.complete) {
            task.state = "done";
            task.loaded = task.total;
            task.err = "";
            renderSheet();
            return;
          }
          var seen = again.size || 0;
          if (seen > lastOffset) stalled = 0; // progress clears the give-up counter
          offset = seen;
          lastOffset = offset;
          task.loaded = offset;
          task.lastLoaded = offset;
          task.lastTime = Date.now();
        } catch (_) { /* still unreachable; keep the offset we had */ }
      }
    }
  }

  function stale(epoch) {
    return epoch !== uploadEpoch;
  }

  // The page cannot be told that the service was stopped — there is nobody
  // left to tell it. A light poll is the next best thing: it turns a minute of
  // silent retries into a visible "service stopped" within a few seconds.
  var serverDown = false;

  async function watchServer(epoch) {
    while (!stale(epoch) && uploading) {
      await sleep(4000);
      if (stale(epoch) || !uploading) return;
      try {
        // Bounded: a stopped listener should fail fast, but a firewall that
        // drops packets instead of resetting them would hang the check for
        // minutes and the page would never admit the service is gone.
        await api("/api/info", 3000);
        if (serverDown) {
          serverDown = false;
          renderSheet();
        }
      } catch (_) {
        if (!serverDown) {
          serverDown = true;
          renderSheet();
        }
      }
    }
  }

  // postCancel tells the server a transfer is being abandoned on purpose, so
  // its final word is "cancelled" instead of the "client disconnected" it can
  // only infer from a socket that dies. Bounded by a timeout: a stopped
  // service must not make the cancel button feel broken.
  function postCancel(id) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 2000);
    return fetch("/api/upload/cancel?id=" + encodeURIComponent(id), {
      method: "POST",
      keepalive: true,
      signal: ctl.signal,
    })
      .catch(function () { /* the server may already be gone */ })
      .then(function () { clearTimeout(timer); });
  }

  // cancelAllUploads drops the whole queue: the chunk in flight is aborted,
  // the ones behind it never start. Bytes already on the server are left
  // alone — they live in the staging file, so picking the same file again
  // resumes instead of restarting.
  async function cancelAllUploads() {
    var active = 0;
    var ids = [];
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].state === "run" || tasks[i].state === "wait") {
        active++;
        if (tasks[i].uploadId) ids.push(tasks[i].uploadId);
      }
    }
    if (!active) return;
    if (!window.confirm(t("cancelAllAsk"))) return;

    uploadEpoch++;
    // Announce first, abort second: reversing the order would let the server
    // report a dropped connection before the cancellation arrives.
    if (ids.length) await Promise.all(ids.map(postCancel));

    for (var j = 0; j < tasks.length; j++) {
      if (tasks[j].xhr) {
        try { tasks[j].xhr.abort(); } catch (_) { /* already finished */ }
        tasks[j].xhr = null;
      }
    }
    // Finished transfers are history and stay; everything else is gone.
    tasks = tasks.filter(function (t) { return t.state === "done"; });
    uploading = false;
    serverDown = false;
    renderSheet();
    toast(t("uploadCancelled"));
  }

  async function pump() {
    if (uploading) return;
    uploading = true;
    var epoch = uploadEpoch;
    $sheet.classList.add("show");
    watchServer(epoch);
    while (epoch === uploadEpoch) {
      var next = null;
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].state === "wait") { next = tasks[i]; break; }
      }
      if (!next) break;
      await uploadOne(next, epoch);
    }
    // A cancel already reset the flag and the queue; touching either here
    // would clobber an upload the user started right after.
    if (stale(epoch)) return;
    uploading = false;

    var failed = tasks.filter(function (t) { return t.state === "err"; }).length;
    var doneCount = tasks.filter(function (t) { return t.state === "done"; }).length;
    if (failed) toast(t("filesFailed", { n: failed }));
    else if (doneCount) toast(t("filesUploaded", { n: doneCount }));

    load(shareId, cwd);
    setTimeout(function () {
      if (!uploading) {
        tasks = tasks.filter(function (t) { return t.state === "err"; });
        renderSheet();
        if (!tasks.length) $sheet.classList.remove("show");
      }
    }, 2600);
  }

  function renderSheet() {
    if (!tasks.length) {
      $sheet.classList.remove("show");
      $sheetBody.innerHTML = "";
      $sheetCancel.hidden = true;
      $sheetTitle.textContent = t("upload");
      $upPill.hidden = true;
      sheetHidden = false;
      return;
    }

    var done = tasks.filter(function (x) { return x.state === "done"; }).length;
    var running = tasks.filter(function (x) { return x.state === "run"; }).length;
    var pending = tasks.filter(function (x) { return x.state === "run" || x.state === "wait"; }).length;
    // Nothing to cancel once the queue has drained; a button that does nothing
    // is worse than no button.
    $sheetCancel.hidden = pending === 0;
    $sheetTitle.textContent = serverDown
      ? t("serverDown")
      : running > 0
        ? t("uploading", { done: done, total: tasks.length })
        : (done === tasks.length ? t("uploadDone") : t("uploadCount", { done: done, total: tasks.length }));

    var html = "";
    for (var i = 0; i < tasks.length; i++) {
      // Named "task" rather than "t": "t" is the translation function.
      var task = tasks[i];
      var pct = task.total ? Math.min(100, Math.round(task.loaded / task.total * 100)) : 0;
      var cls = task.state === "done" ? " done" : (task.state === "err" ? " err" : (task.state === "run" ? " run" : ""));
      var sub;
      if (task.state === "done") sub = t("done", { size: fmtSize(task.total) });
      else if (task.state === "err") sub = t("failed", { err: task.err || t("unknownError") });
      else if (task.state === "wait") sub = t("waiting", { size: fmtSize(task.total) });
      else if (task.err) sub = task.err; // retrying: the reason beats a byte count
      else {
        sub = fmtSize(task.loaded) + " / " + fmtSize(task.total);
        if (task.speed > 0) sub += " · " + fmtSize(task.speed) + "/s";
      }

      html += '<div class="task' + cls + '">' +
        '<div class="task-head"><span class="task-name">' + esc(task.file.name) + "</span>" +
        '<span class="task-pct">' + (task.state === "run" ? pct + "%" : "") + "</span></div>" +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="task-sub">' + esc(sub) + "</div>" +
        "</div>";
    }
    var scroll = $sheetBody.scrollTop;
    $sheetBody.innerHTML = html;
    if ($sheetBody.scrollTop !== scroll) $sheetBody.scrollTop = scroll;

    // While hidden, keep a way back: the pill is the only route to progress
    // and to the cancel button once the panel is gone.
    var activeNow = 0;
    for (var p = 0; p < tasks.length; p++) {
      if (tasks[p].state === "run" || tasks[p].state === "wait") activeNow++;
    }
    $upPill.hidden = !sheetHidden || activeNow === 0;
    if (!$upPill.hidden) $upPillText.textContent = t("activeUploads", { done: done, total: tasks.length });
    if (sheetHidden) return;
    $sheet.classList.add("show");
  }

  // A tab that was open before the binary was rebuilt is running a script that
  // no longer matches the server. It cannot be fixed from the server side, so
  // it asks periodically and reloads itself — never mid-transfer, though.
  function checkBuild(d) {
    if (!d || !d.build || !PAGE_BUILD) return;
    // Opened straight from disk: the placeholder was never substituted.
    if (PAGE_BUILD.charAt(0) === "_") return;
    if (d.build === PAGE_BUILD) return;
    if (uploading) return;
    location.reload();
  }

  setInterval(function () {
    if (uploading || document.hidden) return;
    api("/api/info", 5000).then(checkBuild).catch(function () { /* offline */ });
  }, 60000);

  // Bootstrap. Everything the first paint needs — language, read-only flag,
  // share count — is resolved before anything is rendered. Doing it after the
  // first render used to fire a second full list request and show the loading
  // placeholder twice, which read as the page refreshing on its own.
  api("/api/info")
    .then(function (d) {
      if (!d) return;
      readOnly = !!d.readOnly;
      if (typeof d.count === "number") shareCount = d.count;
      // Adopt the host's language unless this browser already stored an
      // explicit choice.
      if (!storedLang && d.lang) lang = normalizeLang(d.lang);
      checkBuild(d);
    })
    .catch(function () { /* keep the browser language */ })
    .then(function () {
      document.documentElement.lang = lang;
      applyStatic();
      updateLangButton();
      updateRootChip();
      window.addEventListener("hashchange", onRoute);
      onRoute();
    });

  $langBtn.addEventListener("click", function () {
    setLang(lang === "en" ? "zh-Hans" : "en", true);
  });
})();
</script>
</body>
</html>
